<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" font-family="Inter, 'DejaVu Sans', sans-serif">
  <defs>
    <style>
      .h1{font-size:46px;font-weight:800;fill:#111827}
      .sub{font-size:21px;fill:#6B7280}
      .bt{font-size:30px;font-weight:800;fill:#fff}
      .num{font-size:24px;font-weight:800}
      .t{font-size:21px;fill:#1F2937}
      .tb{font-weight:800}
      .s{font-size:18px;fill:#374151}
      .mono{font-family:'DejaVu Sans Mono',monospace}
      .card{fill:#fff;stroke:#E2E6EE;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1900" fill="#F4F6FA"/>

  <text x="800" y="80" text-anchor="middle" class="h1">Rede explicada de um jeito simples</text>
  <text x="800" y="120" text-anchor="middle" class="sub">Pense na rede como uma cidade: o IP é o endereço, a sub-rede é a rua e a VLAN é o andar do prédio.</text>

  <!-- ================= 1. IP ================= -->
  <rect x="40" y="170" width="480" height="760" rx="22" class="card"/>
  <rect x="40" y="170" width="480" height="80" rx="22" fill="#2563EB"/><rect x="40" y="220" width="480" height="30" fill="#2563EB"/>
  <circle cx="92" cy="210" r="24" fill="#fff"/><text x="92" y="219" text-anchor="middle" class="num" fill="#2563EB">1</text>
  <text x="130" y="221" class="bt">IP = o endereço</text>

  <!-- placa da rua -->
  <line x1="150" y1="318" x2="150" y2="480" stroke="#6B7280" stroke-width="6"/>
  <rect x="62" y="290" width="176" height="44" rx="8" fill="#15803D"/>
  <text x="150" y="319" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">Rua 192.168.10</text>
  <!-- casa -->
  <polygon points="245,390 335,318 425,390" fill="#DC2626"/>
  <rect x="262" y="388" width="146" height="92" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="318" y="428" width="34" height="52" rx="3" fill="#92400E"/>
  <rect x="362" y="400" width="38" height="28" rx="5" fill="#fff" stroke="#EA580C" stroke-width="2"/>
  <text x="381" y="421" text-anchor="middle" font-size="17" font-weight="800" fill="#EA580C">25</text>
  <line x1="60" y1="481" x2="500" y2="481" stroke="#9CA3AF" stroke-width="3"/>

  <text x="280" y="562" text-anchor="middle" font-size="50" font-weight="800"><tspan fill="#2563EB">192.168.10</tspan><tspan fill="#EA580C">.25</tspan></text>
  <text x="230" y="600" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">↑ nome da rua</text>
  <text x="412" y="600" text-anchor="middle" font-size="18" font-weight="700" fill="#EA580C">↑ casa</text>

  <text x="80" y="660" class="t">Todo aparelho na rede tem um</text>
  <text x="80" y="690" class="t"><tspan class="tb">endereço único</tspan>. É assim que os</text>
  <text x="80" y="720" class="t">dados sabem para onde ir.</text>

  <rect x="70" y="770" width="420" height="130" rx="14" fill="#EFF6FF"/>
  <text x="94" y="808" class="s tb">Regra de ouro</text>
  <text x="94" y="840" class="s">Dois aparelhos <tspan class="tb">nunca</tspan> podem ter o</text>
  <text x="94" y="868" class="s">mesmo IP na mesma rede.</text>

  <!-- ================= 2. SUB-REDE ================= -->
  <rect x="560" y="170" width="480" height="760" rx="22" class="card"/>
  <rect x="560" y="170" width="480" height="80" rx="22" fill="#EA580C"/><rect x="560" y="220" width="480" height="30" fill="#EA580C"/>
  <circle cx="612" cy="210" r="24" fill="#fff"/><text x="612" y="219" text-anchor="middle" class="num" fill="#EA580C">2</text>
  <text x="650" y="221" class="bt">Sub-rede = a rua</text>

  <!-- rua A -->
  <g>
    <polygon points="610,300 635,280 660,300" fill="#2563EB"/><rect x="614" y="300" width="42" height="34" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <polygon points="690,300 715,280 740,300" fill="#2563EB"/><rect x="694" y="300" width="42" height="34" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <polygon points="770,300 795,280 820,300" fill="#2563EB"/><rect x="774" y="300" width="42" height="34" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <g text-anchor="middle" font-size="14" font-weight="800" fill="#1E3A8A"><text x="635" y="323">.1</text><text x="715" y="323">.2</text><text x="795" y="323">.3</text></g>
    <rect x="596" y="336" width="290" height="36" rx="6" fill="#6B7280"/>
    <text x="741" y="360" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">RUA 192.168.10.x</text>
    <text x="741" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D">✔ na mesma rua: conversam direto</text>
  </g>
  <!-- rua B -->
  <g>
    <polygon points="610,450 635,430 660,450" fill="#7C3AED"/><rect x="614" y="450" width="42" height="34" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <polygon points="690,450 715,430 740,450" fill="#7C3AED"/><rect x="694" y="450" width="42" height="34" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <polygon points="770,450 795,430 820,450" fill="#7C3AED"/><rect x="774" y="450" width="42" height="34" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <g text-anchor="middle" font-size="14" font-weight="800" fill="#4C1D95"><text x="635" y="473">.1</text><text x="715" y="473">.2</text><text x="795" y="473">.3</text></g>
    <rect x="596" y="486" width="290" height="36" rx="6" fill="#6B7280"/>
    <text x="741" y="510" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">RUA 192.168.20.x</text>
  </g>
  <!-- roteador -->
  <path d="M886,354 C905,354 905,400 918,400" fill="none" stroke="#111827" stroke-width="3"/>
  <path d="M886,504 C905,504 905,460 918,460" fill="none" stroke="#111827" stroke-width="3"/>
  <rect x="918" y="392" width="104" height="76" rx="12" fill="#111827"/>
  <text x="970" y="425" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Roteador</text>
  <text x="970" y="447" text-anchor="middle" font-size="13" fill="#CBD5E1">(o porteiro)</text>
  <text x="800" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">→ para ir a outra rua, passa pelo roteador</text>

  <text x="600" y="660" class="t">Sub-rede é um <tspan class="tb">grupo de aparelhos</tspan></text>
  <text x="600" y="690" class="t">que conversam direto. Para falar</text>
  <text x="600" y="720" class="t">com outro grupo, passam pelo roteador.</text>

  <rect x="590" y="770" width="420" height="130" rx="14" fill="#FFF7ED"/>
  <text x="614" y="808" class="s tb">E a tal da máscara?</text>
  <text x="614" y="840" class="s"><tspan class="mono">/24</tspan> ou <tspan class="mono">255.255.255.0</tspan> quer dizer:</text>
  <text x="614" y="868" class="s">3 primeiros números = <tspan class="tb" fill="#2563EB">rua</tspan>; o último = <tspan class="tb" fill="#EA580C">casa</tspan></text>

  <!-- ================= 3. VLAN ================= -->
  <rect x="1080" y="170" width="480" height="760" rx="22" class="card"/>
  <rect x="1080" y="170" width="480" height="80" rx="22" fill="#7C3AED"/><rect x="1080" y="220" width="480" height="30" fill="#7C3AED"/>
  <circle cx="1132" cy="210" r="24" fill="#fff"/><text x="1132" y="219" text-anchor="middle" class="num" fill="#7C3AED">3</text>
  <text x="1170" y="221" class="bt">VLAN = o andar</text>

  <!-- prédio -->
  <rect x="1186" y="272" width="268" height="18" rx="4" fill="#374151"/>
  <rect x="1196" y="290" width="248" height="270" fill="#F3F4F6" stroke="#374151" stroke-width="3"/>
  <rect x="1206" y="300" width="228" height="76" rx="6" fill="#DB2777"/>
  <rect x="1206" y="388" width="228" height="76" rx="6" fill="#D97706"/>
  <rect x="1206" y="476" width="228" height="76" rx="6" fill="#0D9488"/>
  <g stroke="#374151" stroke-width="5"><line x1="1196" y1="382" x2="1444" y2="382"/><line x1="1196" y1="470" x2="1444" y2="470"/></g>
  <g text-anchor="middle" fill="#fff">
    <text x="1320" y="334" font-size="18" font-weight="800">Andar 30</text><text x="1320" y="358" font-size="15">Visitantes</text>
    <text x="1320" y="422" font-size="18" font-weight="800">Andar 20</text><text x="1320" y="446" font-size="15">MIDI</text>
    <text x="1320" y="510" font-size="18" font-weight="800">Andar 10</text><text x="1320" y="534" font-size="15">Áudio</text>
  </g>
  <line x1="1150" y1="561" x2="1490" y2="561" stroke="#9CA3AF" stroke-width="3"/>
  <text x="1320" y="598" text-anchor="middle" font-size="18" font-weight="800" fill="#374151">1 prédio = 1 switch</text>

  <text x="1120" y="660" class="t">Um só switch dividido em</text>
  <text x="1120" y="690" class="t"><tspan class="tb">“andares” separados</tspan>. Quem está</text>
  <text x="1120" y="720" class="t">num andar não escuta o outro.</text>

  <rect x="1110" y="770" width="420" height="130" rx="14" fill="#F5F3FF"/>
  <text x="1134" y="808" class="s tb">Pra que serve?</text>
  <text x="1134" y="840" class="s">Separar coisas que não devem se</text>
  <text x="1134" y="868" class="s">misturar — sem comprar outro switch.</text>

  <!-- ================= 4. SEU CASO ================= -->
  <rect x="40" y="960" width="1520" height="800" rx="22" class="card"/>
  <rect x="40" y="960" width="1520" height="80" rx="22" fill="#0D9488"/><rect x="40" y="1010" width="1520" height="30" fill="#0D9488"/>
  <circle cx="92" cy="1000" r="24" fill="#fff"/><text x="92" y="1009" text-anchor="middle" class="num" fill="#0D9488">4</text>
  <text x="130" y="1011" class="bt">Seu caso: Áudio e MIDI — duas opções</text>

  <!-- Opção A -->
  <rect x="80" y="1070" width="700" height="540" rx="16" fill="#F8FAFC" stroke="#E2E6EE" stroke-width="2"/>
  <text x="104" y="1112" font-size="25" font-weight="800" fill="#111827">Opção A · Simples</text>
  <rect x="560" y="1086" width="196" height="36" rx="18" fill="#DBEAFE"/>
  <text x="658" y="1110" text-anchor="middle" font-size="16" font-weight="800" fill="#1E40AF">1 cabo · 1 rede</text>
  <text x="104" y="1146" class="s">Para setups pequenos — tudo junto, sem VLAN.</text>
  <rect x="120" y="1180" width="140" height="56" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>
  <text x="190" y="1214" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Mesa de som</text>
  <line x1="190" y1="1236" x2="190" y2="1298" stroke="#0D9488" stroke-width="5"/>
  <rect x="168" y="1298" width="44" height="24" rx="4" fill="#0D9488"/>
  <rect x="280" y="1180" width="140" height="56" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>
  <text x="350" y="1214" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Stagebox</text>
  <line x1="350" y1="1236" x2="350" y2="1298" stroke="#0D9488" stroke-width="5"/>
  <rect x="328" y="1298" width="44" height="24" rx="4" fill="#0D9488"/>
  <rect x="440" y="1180" width="140" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
  <text x="510" y="1214" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Teclado MIDI</text>
  <line x1="510" y1="1236" x2="510" y2="1298" stroke="#D97706" stroke-width="5"/>
  <rect x="488" y="1298" width="44" height="24" rx="4" fill="#D97706"/>
  <rect x="600" y="1180" width="140" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
  <text x="670" y="1214" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">iPad</text>
  <line x1="670" y1="1236" x2="670" y2="1298" stroke="#D97706" stroke-width="5"/>
  <rect x="648" y="1298" width="44" height="24" rx="4" fill="#D97706"/>
  <rect x="104" y="1290" width="652" height="80" rx="12" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
  <rect x="168" y="1298" width="44" height="24" rx="4" fill="#0D9488"/><rect x="328" y="1298" width="44" height="24" rx="4" fill="#0D9488"/><rect x="488" y="1298" width="44" height="24" rx="4" fill="#D97706"/><rect x="648" y="1298" width="44" height="24" rx="4" fill="#D97706"/>
  <text x="250" y="1356" text-anchor="middle" font-size="17" font-weight="800" fill="#374151">1 rede só · 192.168.10.x</text>
  <rect x="408" y="1340" width="44" height="24" rx="4" fill="#475569"/>
  <line x1="430" y1="1364" x2="430" y2="1420" stroke="#0D9488" stroke-width="8"/>
  <line x1="430" y1="1364" x2="430" y2="1420" stroke="#D97706" stroke-width="8" stroke-dasharray="8 8"/>
  <text x="448" y="1398" font-size="16" font-weight="800" fill="#374151">áudio + MIDI no mesmo cabo</text>
  <rect x="330" y="1420" width="200" height="64" rx="8" fill="#111827"/>
  <rect x="310" y="1484" width="240" height="13" rx="6" fill="#4B5563"/>
  <text x="430" y="1459" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Computador</text>
  <g font-size="18" font-weight="700">
    <text x="104" y="1536" fill="#15803D">✔ Fácil: liga e funciona</text>
    <text x="104" y="1564" fill="#15803D">✔ MIDI ocupa quase nada da banda</text>
    <text x="104" y="1592" fill="#B45309">⚠ Deixe o Wi-Fi fora dessa rede</text>
  </g>

  <!-- Opção B -->
  <rect x="820" y="1070" width="700" height="540" rx="16" fill="#F8FAFC" stroke="#E2E6EE" stroke-width="2"/>
  <text x="844" y="1112" font-size="25" font-weight="800" fill="#111827">Opção B · Robusta</text>
  <rect x="1300" y="1086" width="196" height="36" rx="18" fill="#CCFBF1"/>
  <text x="1398" y="1110" text-anchor="middle" font-size="16" font-weight="800" fill="#0F766E">2 VLANs · 2 cabos</text>
  <text x="844" y="1146" class="s">Para shows maiores ou com Wi-Fi/iPad na rede.</text>
  <rect x="844" y="1290" width="652" height="80" rx="12" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
  <rect x="852" y="1296" width="314" height="68" rx="8" fill="#CCFBF1"/>
  <rect x="1174" y="1296" width="314" height="68" rx="8" fill="#FEF3C7"/>
  <rect x="860" y="1180" width="140" height="56" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>
  <text x="930" y="1214" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Mesa de som</text>
  <line x1="930" y1="1236" x2="930" y2="1298" stroke="#0D9488" stroke-width="5"/>
  <rect x="908" y="1298" width="44" height="24" rx="4" fill="#0D9488"/>
  <rect x="1020" y="1180" width="140" height="56" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>
  <text x="1090" y="1214" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Stagebox</text>
  <line x1="1090" y1="1236" x2="1090" y2="1298" stroke="#0D9488" stroke-width="5"/>
  <rect x="1068" y="1298" width="44" height="24" rx="4" fill="#0D9488"/>
  <rect x="1180" y="1180" width="140" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
  <text x="1250" y="1214" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Teclado MIDI</text>
  <line x1="1250" y1="1236" x2="1250" y2="1298" stroke="#D97706" stroke-width="5"/>
  <rect x="1228" y="1298" width="44" height="24" rx="4" fill="#D97706"/>
  <rect x="1340" y="1180" width="140" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
  <text x="1410" y="1214" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">iPad / Wi-Fi</text>
  <line x1="1410" y1="1236" x2="1410" y2="1298" stroke="#D97706" stroke-width="5"/>
  <rect x="1388" y="1298" width="44" height="24" rx="4" fill="#D97706"/>
  <text x="960" y="1356" text-anchor="middle" font-size="16" font-weight="800" fill="#0F766E">VLAN 10 · ÁUDIO</text>
  <text x="1360" y="1356" text-anchor="middle" font-size="16" font-weight="800" fill="#B45309">VLAN 20 · MIDI</text>
  <rect x="1118" y="1340" width="44" height="24" rx="4" fill="#0D9488"/><rect x="1178" y="1340" width="44" height="24" rx="4" fill="#D97706"/>
  <line x1="1140" y1="1364" x2="1140" y2="1420" stroke="#0D9488" stroke-width="5"/>
  <line x1="1200" y1="1364" x2="1200" y2="1420" stroke="#D97706" stroke-width="5"/>
  <text x="1128" y="1398" text-anchor="end" font-size="16" font-weight="800" fill="#0F766E">cabo 1 → Áudio</text>
  <text x="1212" y="1398" font-size="16" font-weight="800" fill="#B45309">cabo 2 → MIDI</text>
  <rect x="1070" y="1420" width="200" height="64" rx="8" fill="#111827"/>
  <rect x="1050" y="1484" width="240" height="13" rx="6" fill="#4B5563"/>
  <text x="1170" y="1459" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Computador</text>
  <g font-size="18" font-weight="700">
    <text x="844" y="1536" fill="#15803D">✔ Se o Wi-Fi ou o MIDI falhar, o áudio segue</text>
    <text x="844" y="1564" fill="#B45309">⚠ Precisa de switch gerenciável</text>
    <text x="844" y="1592" fill="#B45309">⚠ Computador com 2 placas (adaptador USB)</text>
  </g>

  <!-- rodapé da seção -->
  <rect x="80" y="1640" width="700" height="96" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="104" y="1678" font-size="20" font-weight="800" fill="#1E40AF">Entre switches (palco ↔ FOH)</text>
  <text x="104" y="1710" class="t">Um cabo só leva tudo — nas duas opções.</text>
  <rect x="820" y="1640" width="700" height="96" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="844" y="1678" font-size="20" font-weight="800" fill="#15803D">Como escolher?</text>
  <text x="844" y="1710" class="t">Comece pela <tspan class="tb">A</tspan>. Show maior ou Wi-Fi na rede → <tspan class="tb">B</tspan>.</text>

  <!-- ================= Resumo ================= -->
  <rect x="40" y="1790" width="1520" height="76" rx="18" fill="#111827"/>
  <g font-size="23" fill="#fff" text-anchor="middle">
    <text x="300" y="1837"><tspan font-weight="800" fill="#93C5FD">IP</tspan> = endereço</text>
    <text x="800" y="1837"><tspan font-weight="800" fill="#FDBA74">Sub-rede</tspan> = rua</text>
    <text x="1300" y="1837"><tspan font-weight="800" fill="#C4B5FD">VLAN</tspan> = andar do prédio</text>
  </g>
</svg>
